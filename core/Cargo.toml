[package]
name = "kepler-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "kepler_core"
path = "src/lib.rs"

[[bin]]
name = "kepler"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
