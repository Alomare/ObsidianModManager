[package]
name = "obsidian-core"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
name = "obsidian_core"
path = "src/lib.rs"

[[bin]]
name = "obsidian"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
assert_cmd = "2.2.2"
