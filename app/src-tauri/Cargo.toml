[package]
name = "obsidian-app"
version = "0.1.0"
description = "Obsidian: mod manager for HELLDIVERS (2015)"
edition = "2024"
publish = false
repository = "https://github.com/Alomare/Obsidian"

[lib]
name = "obsidian_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
obsidian-core = { path = "../../core" }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
# Already in the build through the updater; used for the Discord widget on Home.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
