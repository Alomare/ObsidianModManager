# Linux: the tests and the packages, started by hand. The full port comes later; this shows whether
# anything has got in its way. The deb and the AppImage land in the run's artifacts.
name: Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf

      - name: The LuaJIT 2.0 compiler
        run: sh tools/build-luajit.sh

      - name: Loader tests
        run: target/luajit/luajit loader/tests/run.lua

      - name: Core and app tests
        run: cargo test

      - name: Install the app's packages
        working-directory: app
        run: npm ci

      - name: UI tests
        working-directory: app
        run: npm test

      - name: The deb and the AppImage
        working-directory: app
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
